[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth-input-bridge"
version = "0.1.0"
description = "Fedora input translation core for Hearth Media Center"
requires-python = ">=3.11"

[project.scripts]
hearth-input-bridge = "hearth_input_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hearth_input_bridge*"]
