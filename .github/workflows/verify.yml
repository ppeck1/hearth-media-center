name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-safe:
    name: CI-safe verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep shellcheck unzip

      - name: Install Godot headless runtime
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output "/tmp/${archive}" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${archive}"
          unzip -q "/tmp/${archive}" -d /tmp/godot
          install -D -m 0755 \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            "${RUNNER_TEMP}/bin/godot"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Run CI-safe verifier
        run: ./verify/verify-project.sh --ci
